            if (ci >= 0) return jumpToDate(CHUNKS[ci].first_date.slice(0, 10) < key + '-01' ? key + '-01' : CHUNKS[ci].first_date.slice(0, 10));
        }

        let activeMonth = null;

        function setActiveMonth(key) {
            if (key === activeMonth) return;
            if (activeMonth && monthRows.get(activeMonth)) monthRows.get(activeMonth).classList.remove('active');
            activeMonth = key;
            const row = monthRows.get(key);
            document.querySelectorAll('.nav-year.current').forEach(b => b.classList.remove('current'));
            if (!row) return;
            row.classList.add('active');
            const block = row.closest('.nav-year');
            block.classList.add('current');
            block.querySelector('.nav-year-now').textContent = ' · ' + MONTHS[Number(key.slice(5)) - 1];
            const target = block.classList.contains('open') ? row : block.firstChild;
            const nav = $('sidebar');
            const top = target.offsetTop - nav.clientHeight / 2;
            if (target.offsetTop < nav.scrollTop + 40 || target.offsetTop > nav.scrollTop + nav.clientHeight - 40) nav.scrollTo({ top });
        }

        function markFilteredMonths() {
            for (const [key, row] of monthRows) {
                const outside = (filter.from && key < filter.from.slice(0, 7)) || (filter.to && key > filter.to.slice(0, 7));
                row.classList.toggle('outside', Boolean(outside));
            }
        }

        function updateEdgeNotes() {
            const filtered = filter.from || filter.to || filter.missing;
            $('feed-start').querySelector('.edge-note').textContent = filtered ? 'Beginning of the filtered messages' : 'Beginning of the archive';
            $('feed-end').querySelector('.edge-note').textContent = filtered ? 'End of the filtered messages'
                : 'Newest message in this export' + (INDEX.updated ? ' · updated ' + fmtShortDay(parseLocal(INDEX.updated)) : '');
        }

        function applyFilter(change) {
            Object.assign(filter, change);
            filterVersion++;
            filterControls.clear.hidden = !(filter.from || filter.to || filter.missing);
            markFilteredMonths();
            updateEdgeNotes();
        }

        function setFilter(change) {
            applyFilter(change);
            const target = currentId;
            if (target) jumpTo(target); else jumpToEnd();
        }

        function openSheet() { $('sidebar').classList.add('open'); $('scrim').hidden = false; }
        function closeSheet() { $('sidebar').classList.remove('open'); $('scrim').hidden = true; }
        $('timeline-btn').addEventListener('click', () => $('sidebar').classList.contains('open') ? closeSheet() : openSheet());
        $('scrim').addEventListener('click', closeSheet);

        // ---- search

        let searchRows = null;
        let searchLoading = null;
        let searchTimer = null;
        let selected = -1;

        function normalize(s) {
            return s.normalize('NFKD')
                .replace(/[̀-ًͯ-ٰٟۖ-ۭـ]/g, '')
                .replace(/[إأآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
                .toLowerCase();
        }

        function loadSearch() {
            if (!searchLoading) {
                searchLoading = new Promise((resolve, reject) => {
                    searchRowsReady = rows => {
                        searchRows = rows.map(([id, date, text]) => ({ id, date, text, norm: normalize(text) }));
                        resolve();
                    };
                    loadScript('data/search.js').catch(err => { searchLoading = null; reject(err); });
                });
            }
            return searchLoading;
        }

        function highlight(text, term) {
            let norm = '';
            const map = [];
            for (let i = 0; i < text.length; i++) {
                for (const c of normalize(text[i])) { norm += c; map.push(i); }
            }
            const at = term ? norm.indexOf(term) : -1;
            const clean = s => s.replace(/\s+/g, ' ');
            if (at < 0) return [clean(text.slice(0, 220))];
            const start = map[at];
            const end = at + term.length - 1 < map.length ? map[at + term.length - 1] + 1 : text.length;
            let from = Math.max(0, start - 70);
            if (from && /[\udc00-\udfff]/.test(text[from])) from--;
            return [(from ? '…' : '') + clean(text.slice(from, start)), h('mark', { text: text.slice(start, end) }), clean(text.slice(end, end + 150))];
        }

        async function runSearch(query) {
            const panel = $('results');
            const terms = normalize(query).split(/\s+/).filter(Boolean);
            if (!terms.length) { panel.hidden = true; return; }
            panel.hidden = false;
            if (!searchRows) {
                panel.replaceChildren(h('div', { class: 'results-head', text: 'Loading search…' }));
                try { await loadSearch(); } catch (err) { panel.replaceChildren(h('div', { class: 'results-head', text: err.message })); return; }
                if ($('search').value !== query) return;
            }
            const inRange = r => (!filter.from || r.date.slice(0, 10) >= filter.from) && (!filter.to || r.date.slice(0, 10) <= filter.to);
            const matches = searchRows.filter(r => inRange(r) && terms.every(t => r.norm.includes(t))).reverse();
            selected = -1;
            const head = h('div', { class: 'results-head' });
            panel.replaceChildren(head);
            let shown = 0;
            const more = h('button', { class: 'results-more', onclick: e => { e.stopPropagation(); showMore(); } });
            const showMore = () => {
                const rows = matches.slice(shown, shown + SEARCH_PAGE);
                shown += rows.length;
                more.before(...rows.map(row => h('button', { class: 'result', onclick: () => openResult(row.id) },
                    h('div', { class: 'result-date', text: fmtDay(parseLocal(row.date)) + ', ' + row.date.slice(11, 16) }),
                    h('div', { class: 'result-text', dir: 'auto' }, highlight(row.text, terms[0])))));
                head.textContent = matches.length ? fmtCount(matches.length, 'message', 'messages') + (matches.length > shown ? ` · newest ${fmtNumber(shown)} shown` : '') : 'No messages found';
                more.textContent = `Show older (${fmtNumber(Math.min(SEARCH_PAGE, matches.length - shown))} more)`;
                more.hidden = shown >= matches.length;
            };
            panel.append(more);
            showMore();
        }

        function openResult(id) {
            $('results').hidden = true;
            $('search').blur();
            openMessage(id);
        }

        function searchFor(text) {
            const input = $('search');
            input.value = text;
            input.focus();
            runSearch(text);
        }

        $('search').addEventListener('focus', () => { loadSearch().catch(() => {}); if ($('search').value.trim()) runSearch($('search').value); });
        $('search').addEventListener('input', e => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => runSearch(e.target.value), 150);
        });
        $('search').addEventListener('keydown', e => {
            const items = [...document.querySelectorAll('.result')];
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                selected = Math.max(0, Math.min(items.length - 1, selected + (e.key === 'ArrowDown' ? 1 : -1)));
                items.forEach((el, i) => el.classList.toggle('sel', i === selected));
                if (items[selected]) items[selected].scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'Enter' && items.length) {
                items[Math.max(0, selected)].click();
            } else if (e.key === 'Escape') {
                $('results').hidden = true;
                e.target.blur();
            }
        });
        document.addEventListener('click', e => {
            if (!e.target.closest('.results') && !e.target.closest('.search-wrap')) $('results').hidden = true;
        });

        // ---- clicks inside posts

        feed.addEventListener('click', e => {
            const tag = e.target.closest('.tag');
            if (tag) return searchFor(tag.dataset.q);
            const spoiler = e.target.closest('.spoiler');
            if (spoiler) return spoiler.classList.add('shown');
            const img = e.target.closest('img[data-full]');
            if (img) return openLightbox(img, [...feed.querySelectorAll('img[data-full]')]);
        });

        // ---- lightbox

        let lbList = [];
        let lbIndex = 0;

        function openLightbox(el, list) {
            lbList = list;
            lbIndex = lbList.indexOf(el);
            stopActiveVideo();
            showLightbox();
            $('lightbox').hidden = false;
            document.body.style.overflow = 'hidden';
        }

        function resetLightboxVideo() {
            const video = $('lb-video');
            video.pause();
            video.removeAttribute('src');
            video.load();
            video.hidden = true;
        }

        function showLightbox() {
            const entry = lbList[lbIndex];
            resetLightboxVideo();
            if (entry.dataset.video) {
                const video = $('lb-video');
                $('lb-img').hidden = true;
                $('lb-img').removeAttribute('src');
                video.loop = video.muted = entry.dataset.kind === 'animation';
                video.src = entry.dataset.video;
                video.hidden = false;
                video.play().catch(() => {});
            } else {
                $('lb-img').hidden = false;
                $('lb-img').src = entry.dataset.full;
            }
            $('lb-count').textContent = `${lbIndex + 1} / ${lbList.length}`;
            $('lb-prev').hidden = lbIndex === 0;
            $('lb-next').hidden = lbIndex === lbList.length - 1;
        }

        function stepLightbox(delta) {
            const next = lbIndex + delta;
            if (next < 0 || next >= lbList.length) return;
            lbIndex = next;
            showLightbox();
        }

        function closeLightbox() {
            $('lightbox').hidden = true;
            $('lb-img').removeAttribute('src');
            resetLightboxVideo();
            document.body.style.overflow = '';
            const entry = lbList[lbIndex];
            if (entry && entry.isConnected) {
                const post = entry.closest('[data-id]');
                if (post) {
                    const rect = post.getBoundingClientRect();
                    if (rect.bottom < headerOffset() || rect.top > innerHeight) scrollToPost(post.dataset.id, 'start');
                }
            }
        }

        $('lb-close').addEventListener('click', closeLightbox);
        $('lb-prev').addEventListener('click', e => { e.stopPropagation(); stepLightbox(-1); });
        $('lb-next').addEventListener('click', e => { e.stopPropagation(); stepLightbox(1); });
        $('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });

        // ---- keyboard

        function stepPost(delta) {
            const line = headerOffset() + 8;
            const posts = [...feed.querySelectorAll('[data-id]')];
            const tops = posts.map(el => el.getBoundingClientRect().top);
            const target = delta > 0 ? posts.find((el, i) => tops[i] > line + 1) : posts.findLast((el, i) => tops[i] < line - 1);
            if (target) scrollToPost(target.dataset.id, 'start');
        }

        async function stepMonth(delta) {
            const keys = INDEX.months.map(m => m.key);
            for (let i = keys.indexOf(activeMonth) + delta; i >= 0 && i < keys.length; i += delta) {
                for (let ci = 0; ci < CHUNKS.length; ci++) {
                    if (CHUNKS[ci].month !== keys[i] || chunkSkipped(CHUNKS[ci])) continue;
                    if (pagesOf(await loadChunk(ci)).length) return jumpToMonth(keys[i]);
                }
            }
        }

        document.addEventListener('keydown', e => {
            if (!$('lightbox').hidden) {
                if (e.key === 'Escape') closeLightbox();
                else if (e.key === 'ArrowLeft') stepLightbox(-1);
                else if (e.key === 'ArrowRight') stepLightbox(1);
                return;
            }
            if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
            if (['ArrowDown', 'PageDown', 'End', ' ', 'j'].includes(e.key) && !e.shiftKey && !e.target.closest('button') && continueGesture()) return;
            noteActivity();
            if (e.key === '/') { e.preventDefault(); $('search').focus(); }
            else if (e.key === 'j') stepPost(1);
            else if (e.key === 'k') stepPost(-1);
            else if (e.key === ']') stepMonth(1);
            else if (e.key === '[') stepMonth(-1);
            else if (e.key === 'Escape') closeSheet();
        });

        // ---- theme

        const THEMES = ['system', 'light', 'dark'];
        const THEME_ICONS = {
            system: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>',
            light: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
            dark: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
        };

        function applyTheme(theme) {
            if (theme === 'system') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', theme);
            const button = $('theme-btn');
            button.innerHTML = THEME_ICONS[theme];
            button.title = 'Theme: ' + theme;
        }

        let theme = 'system';
        try { theme = localStorage.getItem('tg-archive-theme') || 'system'; } catch (e) {}
        if (!THEMES.includes(theme)) theme = 'system';
        applyTheme(theme);
        $('theme-btn').addEventListener('click', () => {
            theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
            applyTheme(theme);
            try { localStorage.setItem('tg-archive-theme', theme); } catch (e) {}
        });

        // ---- start

        const CHAT_TYPES = { public_channel: 'Channel', public_group: 'Group', public_supergroup: 'Group', personal_chat: 'Private chat' };

        function buildHeader() {
            const chat = INDEX.chat || {};
            const name = chat.name || 'Telegram Archive';
            document.title = name + ' · Telegram Archive';
            $('chat-name').textContent = name;
            const fillAvatar = el => {
                el.style.background = avatarColor(chat.id || name);
                el.textContent = initials(name);
                if (chat.photo) {
                    const img = h('img', { src: chat.photo, alt: '' });
                    img.onerror = () => { el.textContent = initials(name); };
                    el.replaceChildren(img);
                }
                return el;
            };
            fillAvatar($('avatar'));
            const months = INDEX.months;
            const range = months.length ? monthLabel(months[0].key) + (months.length > 1 ? ' – ' + monthLabel(months[months.length - 1].key) : '') : '';
            const meta = [chat.username ? '@' + chat.username : null, CHAT_TYPES[chat.type] || 'Chat', fmtCount(INDEX.total, 'message', 'messages'), range].filter(Boolean).join(' · ');
            $('chat-meta').textContent = meta;
            showAuthor = chat.type !== 'public_channel';

            const title = chat.username
                ? h('a', { href: 'https://t.me/' + encodeURIComponent(chat.username), target: '_blank', rel: 'noopener noreferrer', text: name })
                : name;
            $('feed-start').replaceChildren(fillAvatar(h('div', { class: 'avatar' })), h('h2', { dir: 'auto' }, title),
                h('div', { text: meta }),
                chat.description ? h('div', { class: 'description', dir: 'auto', text: chat.description }) : null,
                h('div', { class: 'edge-note' }));
            $('feed-end').replaceChildren(h('div', { class: 'edge-note' }));
            updateEdgeNotes();
        }

        const VIEW_ICONS = {
            feed: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
            grid: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="8" rx="1.5"/><path d="M4 15h16M4 19h11"/></svg>',
        };

        function applyView() {
            document.body.classList.toggle('grid', view === 'grid');
            const button = $('view-btn');
            button.innerHTML = VIEW_ICONS[view];
            button.title = view === 'grid' ? 'Show messages' : 'Show media only';
            button.setAttribute('aria-label', button.title);
        }

        function chooseView(next) {
            view = next;
            try { localStorage.setItem('tg-archive-view', view); } catch (e) {}
            applyView();
            filterVersion++;
        }

        function setView(next, id) {
            chooseView(next);
            const target = id || currentId;
            if (target) jumpTo(target, { flash: Boolean(id) }); else jumpToEnd();
        }

        for (const el of document.querySelectorAll('.to-start')) el.addEventListener('click', jumpToStart);
        document.querySelector('.identity').addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); jumpToStart(); }
        });

        $('view-btn').addEventListener('click', () => setView(view === 'grid' ? 'feed' : 'grid'));

        function start() {
            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
            if (!INDEX) {
                feed.replaceChildren(h('div', { class: 'status error', text: 'data/index.js could not be loaded. Rebuild the viewer with: python bot.py --viewer-only <export directory>' }));
                return;
            }
            for (const month of INDEX.months) {
                for (const chunk of month.chunks) CHUNKS.push({ ...chunk, month: month.key });
            }
            applyView();
            buildHeader();
            buildSidebar();
            if (!CHUNKS.length) {
                feed.replaceChildren(h('div', { class: 'status', text: 'This export has no messages.' }));
                return;
            }
            const id = Number(location.hash.slice(1));
            if (id) jumpTo(id); else jumpToEnd();
        }

        start();
    </script>
</body>
